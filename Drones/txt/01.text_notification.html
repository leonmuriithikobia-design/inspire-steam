


<html>
    <head>
        <title>Module01:h1 , h2 , p ,em , div</title>
    </head>
    <body>
        <h1>Music Band</h1>
        <hr>
        <h2>About the Band</h2>

        <div>
            <!--em(emphasis) b (bold)-->
            <p>Rediscovering music,<em>One album at a time</em></p>
            <p>Est <b>2026</b></p>
            <!--small(small text) and i (italic)-->
            <p><small><i>Find our merch on merch.ebay.com</i></small></p>
            
            <hr>
        </div>
        <div>

        </div>
        <h3>Discover</h3>
        <!--sub(subscript), sup(Superscript)-->
        <li>H <sub>2</sub>0</li>
        <li>E is MC <sup>2</sup></li>

        <h4>Lyrics H<sub>2</sub>0</h4>
        <i>
            But the good ones go if you wait to long..
        </i>
        
          
        
    </body>
</html>
