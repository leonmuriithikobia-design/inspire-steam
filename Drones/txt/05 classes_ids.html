<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module05: Classes, ids</title>
</head>
<body>
    <!--
    id: unique, only one element in a page should have it

    class: reusable. Used to identify multiple elements together
    -->
    <div id="page-wrapper">
        <h1>Drake</h1>
        <p>6 God from the great Toronto, revolutionising Rap and RNB fusion</p>
        <img class="OVO Photos" src="./Assets/drake.jpg" alt="Band Photo">
        <img class="OVO Photos" src="./Assets/drizzy.jpg" alt="Band Photo">

    </div>
</body>
</html>
